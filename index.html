<script>
/* RHW loader (t117u): phones / tablets get mobile.html (half-res textures, same game), desktops get desktop.html.
   ?hd forces desktop, ?ld forces mobile; every other query (?nointro, ?force=reap …) is passed through. */
(function () {
  var q = location.search, p = new URLSearchParams(q), mm = function (m) { return !!(window.matchMedia && matchMedia(m).matches); };
  var ua = navigator.userAgent || '', ipadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var small = Math.min(screen.width, screen.height) <= 820;
  var mobile = /iPhone|iPad|iPod|Android|Mobile/i.test(ua) || ipadOS || (touch && mm('(pointer:coarse)')) || (touch && small);
  if (p.has('hd')) mobile = false; if (p.has('ld')) mobile = true;
  location.replace((mobile ? 'mobile.html' : 'desktop.html') + q + location.hash);
})();
</script><noscript><a href="desktop.html">desktop</a> · <a href="mobile.html">mobile</a></noscript></body></html>
